<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a13">
<title>City Lights – Puzzle</title>
  <meta name="description" content="Light up the city, one window at a time. A cozy nighttime logic puzzle.">
  <meta property="og:title" content="City Lights – Puzzle">
  <meta property="og:description" content="Light up the city, one window at a time. A cozy nighttime logic puzzle.">

<style>
  :root{--night:#070a13;--ink:#cfc9ba;--dim:#5b6478;--amber:#ffb84d;color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--night) !important;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  body{display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
  header{background:var(--night);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px;letter-spacing:.14em}
  #prog{font-size:12px;color:var(--dim);justify-self:start}
  #lvl{font-size:15px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.18em}
  #lvlNav{display:flex;align-items:center;gap:10px;justify-self:center}
  #hearts{justify-self:end;display:flex;gap:4px;font-size:15px}
  #hearts span{transition:opacity .3s,transform .3s;text-shadow:0 0 8px rgba(255,90,90,.4)}
  #hearts span.lost{opacity:.22;transform:scale(.8);text-shadow:none}
  #rules{background:var(--night);display:flex;gap:8px;padding:6px 16px 8px;justify-content:center}
  #rules.hide{display:none}
  #infoCard #rules{display:flex;flex-direction:column;gap:12px;padding:6px 0 2px;background:transparent}
  #setPanel{position:fixed;z-index:30;background:#141a2b;border:1px solid #2c3550;border-radius:14px;
    padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);min-width:172px}
  #setPanel[hidden]{display:none}
  .setRow{border:none;background:#1b2236;color:#cfc9ba;font-size:13px;letter-spacing:.05em;
    padding:10px 14px;border-radius:10px;text-align:left;font-weight:600}
  .setRow:active{background:#232c46}
  .setRow.off{color:#5a6378}
  #infoModal{position:fixed;inset:0;z-index:40;background:rgba(4,6,12,.72);display:flex;
    align-items:center;justify-content:center;padding:24px}
  #infoModal[hidden]{display:none}
  #infoCard{background:#141a2b;border:1px solid #2c3550;border-radius:16px;padding:18px 20px 16px;
    max-width:320px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.6)}
  #infoCard h3{margin:0 0 10px;font-size:12px;letter-spacing:.3em;color:#ffb84d;text-align:center;font-weight:700}
  #infoClose{display:block;margin:14px auto 0;border:none;background:#2ea86c;color:#0b1420;
    font-weight:800;font-size:13px;letter-spacing:.12em;padding:10px 26px;border-radius:12px}
  @keyframes teachPulse{0%,100%{border-color:#232b3f;box-shadow:none}
    50%{border-color:var(--amber);box-shadow:0 0 14px rgba(255,184,77,.25)}}
  .rule.teach{animation:teachPulse 1.6s ease-in-out infinite}
  .rule{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:5px;
    background:rgba(255,255,255,0.025);border:1px solid #1d2436;border-radius:12px;
    padding:8px 6px;font-size:9.5px;line-height:1.3;color:#7d8598;text-align:center;letter-spacing:.03em}
  .rule svg{display:block}
  .rule.violate{border-color:#ff5f4d;color:#ff9384;background:rgba(255,95,77,0.06);
    animation:rshake .45s}
  @keyframes rshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}
    40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  button.nav{border:none;background:transparent;color:var(--dim);font-size:20px;
    padding:0 6px;line-height:1;border-radius:6px}
  button.nav:active{color:var(--amber)}
  button.nav:disabled{opacity:.25}
  #title{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  main{flex:1;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  footer{background:var(--night);display:flex;gap:18px;justify-content:center;align-items:center;
    padding:8px 16px 18px;min-height:84px;box-sizing:border-box}
  #cityLbl{font-size:9.5px;letter-spacing:.32em;font-weight:700;margin-bottom:1px}
  #hintTxt{display:none;position:absolute;left:0;right:0;bottom:5px;z-index:3;pointer-events:none;
    font-size:11px;color:#3d4557;letter-spacing:.06em;text-align:center;padding:2px 14px 4px}
  #hintTxt.show{display:block}
  #tooltip{position:absolute;background:#141a2b;border:1px solid #2c3550;color:#cfc9ba;
    font-size:11px;line-height:1.45;padding:7px 11px;border-radius:10px;max-width:230px;
    text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;
    transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:5;letter-spacing:.03em;text-wrap:balance}
  #tooltip.show{opacity:1}
  #homeBtn{border:none;background:transparent;color:var(--dim);font-size:17px;padding:0 8px 0 0}
  #homeBtn:active{color:var(--amber)}
  #menu{position:fixed;inset:0;background:var(--night);z-index:15;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(26px + env(safe-area-inset-bottom,0px));
    overflow-y:auto}
  #menu[hidden]{display:none}
  #menuSky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #menu>*:not(#menuSky){position:relative;z-index:1}
  #menu .logo{margin-bottom:auto;flex:none}
  @keyframes lbreathe{0%,100%{opacity:1}50%{opacity:.82}}
  #logoWord{animation:lbreathe 5.4s ease-in-out infinite}
  /* asagidan yukari yigin: all(2 girinti) > next(1) > current(0) > CTA */
  #curCard{width:100%;max-width:360px;background:rgba(11,15,27,.72);
    border:1.5px solid #2a3350;border-radius:22px;padding:16px 20px 14px;
    margin-bottom:26px;text-align:center;position:relative}
  .ctag{position:absolute;top:13px;left:16px;font-size:9px;letter-spacing:.26em;color:#8a93b0;
    border:1px solid #2a3350;border-radius:99px;padding:4px 10px}
  .cart{width:100%;max-width:312px;height:138px;margin:26px auto 2px;display:block;border-radius:12px}
  #curName{font-size:20px;letter-spacing:.26em;font-weight:700;margin:8px 0 12px}
  .cbar{height:5px;background:#1a2033;border-radius:3px;position:relative;margin:0 8px}
  .cbar i{display:block;height:100%;background:var(--amber);border-radius:3px}
  .cbar b{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
    background:var(--amber);transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(240,168,62,.5)}
  .ccnt{font-size:11px;color:var(--amber);margin-top:9px;letter-spacing:.14em}
  .cdiv{height:1px;background:#222a3e;margin:13px 4px 11px}
  .cnext{display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:11px;color:#8a93b0;letter-spacing:.06em}
  .cnext img{width:17px;height:17px;border-radius:4px;opacity:.6}
  #btnRow{display:flex;align-items:stretch;gap:11px;width:100%;max-width:372px;margin-bottom:6px}
  .sideBtn{flex:1;background:rgba(255,255,255,0.02);border:1px solid #232c3e;border-radius:16px;
    color:#9aa2ba;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:9px 4px;position:relative}
  .sideBtn:active{border-color:#3a3422}
  .sideBtn svg{width:19px;height:19px;margin-bottom:1px}
  .sbT{font-size:10px;letter-spacing:.14em;font-weight:700}
  .sbS{font-size:8.5px;letter-spacing:.1em;color:var(--amber)}
  #dailyBtn .sbS{color:#6f7794}
  .dot{position:absolute;top:9px;right:11px;width:7px;height:7px;border-radius:50%;
    background:var(--amber);box-shadow:0 0 6px rgba(240,168,62,.6)}
  #dailySoon{position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    background:#141a2b;border:1px solid #2c3550;color:#cfc9ba;font-size:10px;font-style:normal;
    padding:3px 10px;border-radius:8px;transition:opacity .25s;opacity:1}
  #dailySoon[hidden]{display:block;opacity:0;pointer-events:none}
  #playBtn:active{filter:brightness(1.08)}
  #playBtn{border:none;border-radius:18px;background:linear-gradient(180deg,#57b06f,#3f9158);color:#eef5ee;box-shadow:0 6px 22px rgba(70,160,100,.28);padding:10px 6px;flex:1.35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .pbT{font-size:17px;letter-spacing:.08em;font-weight:800}
  .pbS[hidden]{display:none}
  #playBtn.hard{background:linear-gradient(180deg,#e05a4e,#bf3a30);box-shadow:0 6px 22px rgba(210,70,55,.32)}
  #playBtn.hard .pbS{color:#ffd9d4;opacity:1}
  .pbS{font-size:10.5px;letter-spacing:.08em;opacity:.85;font-weight:600}
  @media (max-width:374px){.sbS{display:none}.sbT{font-size:9px}}
  #passport{position:fixed;inset:0;background:var(--night);z-index:16;
    overflow-y:auto;padding:calc(30px + env(safe-area-inset-top,0px)) 18px 40px}
  #passport[hidden]{display:none}
  .phead{display:flex;align-items:center;gap:10px;max-width:380px;margin:0 auto 20px;
    border-bottom:1px solid #222a3e;padding-bottom:14px}
  #passBack{background:none;border:none;color:#cfc9ba;font-size:26px;padding:0 8px;line-height:1}
  .ptitle{font-size:17px;letter-spacing:.26em;color:var(--ink);font-weight:700}
  .pcnt{margin-left:auto;font-size:11px;color:var(--amber);letter-spacing:.08em}
  #stampGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:380px;margin:0 auto}
  .stamp{aspect-ratio:120/145;display:flex;align-items:center;justify-content:center}
  .stamp svg{width:100%;height:100%}
  #modal{position:fixed;inset:0;background:rgba(3,5,10,.74);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:24px}
  #modal[hidden]{display:none}
  #modal .card{background:#12182a;border:1px solid #232b3f;border-radius:22px;
    padding:28px 26px calc(22px);max-width:320px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #modal h2{font-size:21px;font-weight:600;letter-spacing:.05em;color:var(--ink)}
  #modal .mh{font-size:34px;margin:14px 0 10px;animation:hb 1.1s ease-in-out infinite}
  @keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  #modal p{font-size:13px;line-height:1.5;color:#8a92a6;letter-spacing:.04em;margin-bottom:20px}
  #modal button{display:block;width:100%;border-radius:14px;padding:13px 0;font-size:14px;
    letter-spacing:.08em;margin-top:10px}
  #modal .primary{background:var(--amber);border:none;color:#221503;font-weight:700}
  #modal .primary:active{background:#e6a545;color:#221503}
  #modal .ghost{background:transparent;border:1px solid #2c3550;color:#8a92a6}
  #boostBtn{position:relative;width:54px;height:54px;border-radius:50%;
    border:1px solid #3a3422;background:rgba(255,184,77,0.07);font-size:24px;padding:0}
  #boostBtn:disabled{opacity:.3}
  #boostBtn .badge{position:absolute;top:-4px;right:-4px;background:#c0392b;color:#fff;
    font-size:11px;font-weight:600;border-radius:9px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;letter-spacing:0}
  #banner{background:var(--night);height:calc(60px + env(safe-area-inset-bottom,0px));flex:none;
    display:flex;align-items:center;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:rgba(255,255,255,0.03)}
  #banner .label{font-size:10px;letter-spacing:.24em;color:#39415a;text-transform:uppercase}
  #hintTxt.tip{color:#8a7a4e}
  button{background:transparent;border:1px solid #232b3f;color:var(--dim);
    border-radius:10px;padding:9px 18px;font-size:13px;letter-spacing:.1em;
    font-family:inherit;transition:color .2s,border-color .2s}
  button:active{color:var(--amber);border-color:var(--amber)}
  #hintTxt.win{color:var(--amber);font-size:14px;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;
    text-shadow:0 0 18px rgba(255,184,77,.45)}
  #hintTxt.win small{display:block;margin-top:3px;font-weight:400;font-size:11px;
    color:var(--dim);text-transform:none;letter-spacing:.08em;text-shadow:none}
  /* win butonlari: mobil oyun CTA'si — dolgun, basilabilir, hiyerarsili */
  #nextBtn{
    background:linear-gradient(180deg,#ffd98f,#f0a83e);
    color:#241a08;border:none;font-weight:700;
    padding:14px 30px;border-radius:16px;font-size:15px;letter-spacing:.04em;
    box-shadow:0 6px 22px rgba(255,184,77,.30),0 3px 0 #8a5f1e;
    transition:transform .08s,box-shadow .08s;
  }
  #nextBtn:active{
    color:#241a08;transform:translateY(3px);
    box-shadow:0 3px 12px rgba(255,184,77,.22),0 0 0 #8a5f1e;
  }
  #menuBtn{
    background:#151b2c;color:var(--amber);
    border:1.5px solid #4a3d22;font-weight:600;
    padding:14px 26px;border-radius:16px;font-size:15px;letter-spacing:.04em;
    box-shadow:0 3px 0 #0b0f1a;
    transition:transform .08s,box-shadow .08s;
  }
  #menuBtn:active{
    color:var(--amber);border-color:#6a5730;transform:translateY(3px);
    box-shadow:0 0 0 #0b0f1a;
  }
</style>
</head>
<body>
<div id="bgFix" style="position:fixed;inset:-120px;background:var(--night);z-index:-1;pointer-events:none"></div>
<header>
  <span style="display:flex;align-items:center">
    <button id="homeBtn">⌂</button>
    <span id="prog">0%</span>
  </span>
  <span id="lvlNav">
    <span style="display:flex;flex-direction:column;align-items:center;line-height:1.1">
      <span id="cityLbl"></span>
      <span style="display:flex;align-items:center;gap:2px">
        <button id="prevLvl" class="nav">‹</button>
        <span id="lvl">Level 1</span>
        <button id="nextLvl" class="nav">›</button>
      </span>
    </span>
  </span>
  <span id="hearts"><span>❤️</span><span>❤️</span><span>❤️</span></span>
</header>
<div id="rules">
  <div class="rule" id="rule1">
    <svg width="30" height="24" viewBox="0 0 30 24"><rect x="1" y="2" width="8" height="8" rx="1.5" fill="#ffb84d" opacity="0.9"/><rect x="11" y="2" width="8" height="8" rx="1.5" fill="#ffb84d" opacity="0.9"/><rect x="21" y="2" width="8" height="8" rx="1.5" fill="#ffb84d" opacity="0.9"/><rect x="1" y="12" width="8" height="8" rx="1.5" fill="#ffb84d" opacity="0.9"/><rect x="11" y="12" width="8" height="8" rx="1.5" fill="#ffb84d" opacity="0.9"/><rect x="21" y="12" width="8" height="8" rx="1.5" fill="#ffb84d" opacity="0.9"/></svg>
    Light every home
  </div>
  <div class="rule" id="rule2">
    <svg width="30" height="24" viewBox="0 0 30 24"><circle cx="6" cy="12" r="4" fill="#ffe9bd"/><circle cx="24" cy="12" r="4" fill="#ffe9bd"/><line x1="10" y1="12" x2="20" y2="12" stroke="#ff5f4d" stroke-width="2" stroke-dasharray="2 2"/><line x1="12" y1="6" x2="18" y2="18" stroke="#ff5f4d" stroke-width="2.4"/></svg>
    Lights can't see each other
  </div>
  <div class="rule" id="rule3">
    <svg width="30" height="24" viewBox="0 0 30 24"><rect x="10" y="7" width="10" height="10" rx="1.5" fill="#161a26" stroke="#2a3145"/><text x="15" y="15.5" font-size="8.4" font-weight="700" fill="#ffb84d" text-anchor="middle">2</text><circle cx="5" cy="12" r="3.4" fill="#ffe9bd"/><circle cx="25" cy="12" r="3.4" fill="#ffe9bd"/></svg>
    Numbers = adjacent lights
  </div>
</div>
<main>
  <canvas id="cv"></canvas>
  <div id="tooltip"></div>
  <div id="hintTxt"></div>
</main>
<footer>
  <button id="resetBtn">Reset</button>
  <button id="boostBtn">💡<span class="badge" id="hintCount">3</span></button>
  <button id="setBtn" aria-label="Settings">⚙️</button>
  <button id="menuBtn" hidden>Main menu</button>
  <button id="nextBtn" hidden>Next level</button>
</footer>
<div id="setPanel" hidden>
  <button class="setRow" id="sndTgl">🔊 Sound On</button>
  <button class="setRow" id="musTgl">🎵 Music On</button>
  <button class="setRow" id="infoBtn">💡 How to Play</button>
</div>
<div id="infoModal" hidden>
  <div id="infoCard">
    <h3>HOW TO PLAY</h3>
    <button id="infoClose">GOT IT</button>
  </div>
</div>
<div id="banner"><span class="label">Ad Banner</span></div>
<div id="menu">
  <canvas id="menuSky"></canvas>
  <svg class="logo" width="270" height="118" viewBox="0 0 270 118">
    <defs>
      <filter id="lg" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="wl" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd98f"/><stop offset="1" stop-color="#f0a83e"/>
      </linearGradient>
    </defs>
    <g>
      <rect x="78"  y="14" width="24" height="24" rx="4" fill="#0b0f1b" stroke="#1b2233" stroke-width="2"/>
      <rect x="108" y="14" width="24" height="24" rx="4" fill="#0b0f1b" stroke="#1b2233" stroke-width="2"/>
      <rect id="logoLit" x="138" y="14" width="24" height="24" rx="4" fill="url(#wl)" stroke="#5a4520" stroke-width="2" filter="url(#lg)"/>
      <rect x="168" y="14" width="24" height="24" rx="4" fill="#0b0f1b" stroke="#1b2233" stroke-width="2"/>
      <line x1="150" y1="14" x2="150" y2="38" stroke="#30240c" stroke-width="1.8"/>
      <line x1="138" y1="26" x2="162" y2="26" stroke="#30240c" stroke-width="1.8"/>
      <line x1="90" y1="14" x2="90" y2="38" stroke="#141a2a" stroke-width="1.8"/>
      <line x1="78" y1="26" x2="102" y2="26" stroke="#141a2a" stroke-width="1.8"/>
      <line x1="120" y1="14" x2="120" y2="38" stroke="#141a2a" stroke-width="1.8"/>
      <line x1="108" y1="26" x2="132" y2="26" stroke="#141a2a" stroke-width="1.8"/>
      <line x1="180" y1="14" x2="180" y2="38" stroke="#141a2a" stroke-width="1.8"/>
      <line x1="168" y1="26" x2="192" y2="26" stroke="#141a2a" stroke-width="1.8"/>
    </g>
    <clipPath id="lwClip"><rect x="139" y="15" width="22" height="22" rx="3"/></clipPath>
    <g clip-path="url(#lwClip)">
      <g id="logoCatSit" opacity="1">
        <ellipse cx="150" cy="32.6" rx="4" ry="4.4" fill="#241703"/>
        <circle cx="150" cy="25.8" r="3.25" fill="#241703"/>
        <path d="M147.3,23.7 L146.5,20.6 L149.0,22.6 Z" fill="#241703"/>
        <path d="M152.7,23.7 L153.5,20.6 L151.0,22.6 Z" fill="#241703"/>
        <path d="M153.9,32.7 q3.4,0.5 3.1,-3.1" stroke="#241703" stroke-width="1.15" fill="none" stroke-linecap="round"/>
      </g>
      <g id="logoCatWalk" opacity="0">
        <ellipse cx="0" cy="-2.3" rx="3.5" ry="2" fill="#241703"/>
        <circle cx="-3.4" cy="-4" r="1.9" fill="#241703"/>
        <path d="M-4.6,-5.2 L-5,-7.2 L-3.6,-6 Z" fill="#241703"/>
        <path d="M-2.4,-5.4 L-2.2,-7.4 L-1,-6 Z" fill="#241703"/>
        <path d="M3.2,-3 q2.2,-1 1.8,-3.6" stroke="#241703" stroke-width="0.9" fill="none" stroke-linecap="round"/>
        <line x1="-2" y1="-0.4" x2="-2" y2="0" stroke="#241703" stroke-width="1.1"/>
        <line x1="2" y1="-0.4" x2="2" y2="0" stroke="#241703" stroke-width="1.1"/>

function loKick(t){
  const o=AC.createOscillator(),v=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(105,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.12);

  v.gain.exponentialRampToValueAtTime(0.10,t+0.008);
  v.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(v);v.connect(bgg());o.start(t);o.stop(t+0.25);
}
function loSnare(t){
  const n=Math.ceil(AC.sampleRate*0.08);
  const b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource();src.buffer=b;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=0.9;
  const v=AC.createGain();v.gain.value=0.05;
  src.connect(f);f.connect(v);v.connect(bgg());src.start(t);
}
function loHat(t,g){
  const n=Math.ceil(AC.sampleRate*0.025);
  const b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);

  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=8000;
  const v=AC.createGain();v.gain.value=g;
  src.connect(f);f.connect(v);v.connect(bgg());src.start(t);

function loRhodes(t,f,g,d){
  // rhodes hissi: sinus govde + kisik 2. harmonik, lowpass, orta sonum
  const o=AC.createOscillator(),o2=AC.createOscillator();
  const v=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sine';o.frequency.value=f;
  o2.type='triangle';o2.frequency.value=f*2.004;
  lp.type='lowpass';lp.frequency.value=1300;
  const v2=AC.createGain();v2.gain.value=0.25;
  v.gain.setValueAtTime(0.0001,t);
  v.gain.exponentialRampToValueAtTime(g,t+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(lp);o2.connect(v2);v2.connect(lp);
  lp.connect(v);v.connect(bgg());
  if(BG.delay)v.connect(BG.delay);
  o.start(t);o.stop(t+d+0.05);o2.start(t);o2.stop(t+d+0.05);
}
function loBass(t,f,d){
  const o=AC.createOscillator(),v=AC.createGain();
  o.type='sine';o.frequency.value=f;

  v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v);v.connect(bgg());o.start(t);o.stop(t+d+0.05);

function startBgMusic(){
  if(!musOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(BG.on)return;
    BG.on=true;
    const g=bgg(),t=AC.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(0.0001,g.gain.value),t);
    g.gain.linearRampToValueAtTime(1,t+0.9);
    BG.delay=AC.createDelay(1.5);BG.delay.delayTime.value=L16*6;
    const fb=AC.createGain();fb.gain.value=0.28;
    const flp=AC.createBiquadFilter();flp.type='lowpass';flp.frequency.value=1400;
    const wet=AC.createGain();wet.gain.value=0.35;
    BG.delay.connect(flp);flp.connect(fb);fb.connect(BG.delay);
    BG.delay.connect(wet);wet.connect(g);
    BG.step=0;BG.next=AC.currentTime+0.1;
    BG.int=setInterval(()=>{
      if(!BG.on)return;
      while(BG.next<AC.currentTime+0.3){
        const i=BG.step%128, bar=(i/16)|0, j=i%16;
        const CH=LCH[bar], t0=BG.next;
        // davullar: tembel boom-bap, cok kisik — ilk bar davulsuz girer
        const intro=BG.step<16;
        if(!intro){
          if(j===0)loKick(t0);
          if(j===10&&bgHash(bar*3+1)>0.35)loKick(t0);
          if(j===4||j===12)loSnare(t0);
        }
        if(j%2===0&&j%4!==0)loHat(t0+0.028,intro?0.008:0.016); // swing: offbeat hatler tembel
        else if(j%4===0&&j>0)loHat(t0,intro?0.006:0.011);
        // akor: bar basinda vur, sus (surekli ton yok)
        if(j===0)CH.c.forEach((f,k)=>loRhodes(t0+k*0.012,f,0.024,1.6));
        if(j===7&&bgHash(bar*5+2)>0.5)CH.c.slice(1,3).forEach((f,k)=>loRhodes(t0+k*0.01,f,0.013,0.9));
        // bas: kok + ara vurus
        if(j===0)loBass(t0,CH.b,0.5);
        if(j===10)loBass(t0,CH.b,0.28);
        if(j===14&&bgHash(bar*7+3)>0.6)loBass(t0,CH.b*1.5,0.2);
        // seyrek melodi serpintisi (delay kuyrugu ile)
        if(j===(4+((bgHash(bar*11+5)*10)|0))&&bgHash(bar*13+4)>0.72){
          loRhodes(t0,LMEL[(bgHash(bar*17+6)*LMEL.length)|0]*2,0.014,1.2);
        }
        BG.step++;BG.next+=L16;
      }
    },70);
  }catch(e){}
}
function stopBgMusic(fast){
  if(!BG.on)return;
  BG.on=false;
  clearInterval(BG.int);
  const g=bgg(),t=AC.currentTime;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(Math.max(0.0001,g.gain.value),t);
  g.gain.linearRampToValueAtTime(0.0001,t+(fast?0.4:1.2));
  BG.delay=null;
}

    MUS.gain.gain.cancelScheduledValues(t);
    MUS.gain.gain.setValueAtTime(Math.max(0.0001,MUS.gain.gain.value),t);
    MUS.gain.gain.linearRampToValueAtTime(0.0001,t+FD);

// (r,c)'den isin yay: {cells:Map(key->dist), mirrors:Set}
function castFrom(r,c){
  const cells=new Map([[key(r,c),0]]);
  const mirrors=new Set();
  DIRS.forEach(d0=>{
    let dr=d0[0],dc=d0[1],nr=r+dr,nc=c+dc,d=1;
    const seen=new Set();
    while(nr>=0&&nr<rows&&nc>=0&&nc<cols){
      const t=cellType[nr][nc];
      if(t==='/'){const tmp=dr;dr=-dc;dc=-tmp;mirrors.add(key(nr,nc))}
      else if(t==='\\'){const tmp=dr;dr=dc;dc=tmp;mirrors.add(key(nr,nc))}
      else if(isRoom(t)){
        const k=key(nr,nc);
        if(!cells.has(k)||cells.get(k)>d)cells.set(k,d);
      }
      else break;
      const st=nr+','+nc+','+dr+','+dc;
      if(seen.has(st))break;
      seen.add(st);
      nr+=dr;nc+=dc;d++;
    }
  });
  return{cells,mirrors};
}

function recompute(changed,place){
  const now=performance.now();
  sources={};conflict=new Set();activeMirrors=new Set();
  const dist={}; // degisen noktadan dalga mesafesi
  bulbs.forEach(b=>{
    const[r,c]=b.split(',').map(Number);
    const{cells,mirrors}=castFrom(r,c);
    mirrors.forEach(m=>activeMirrors.add(m));
    cells.forEach((d,k)=>{
      (sources[k]=sources[k]||new Set()).add(b);
      if(k!==b&&bulbs.has(k)){conflict.add(b);conflict.add(k)}
      if(changed&&b===key(changed[0],changed[1]))
        dist[k]=Math.min(dist[k]??99,d);
    });
  });
  if(changed&&!place){ // geri cekilme dalgasi: kaldirilan noktadan
    const{cells}=castFrom(changed[0],changed[1]);
    cells.forEach((d,k)=>{if(!(k in dist))dist[k]=d});
  }
  // sayili bloklar
  numState={};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=cellType[r][c];
    if(t>='0'&&t<='4'){
      const need=+t;let cnt=0;
      DIRS.forEach(([dr,dc])=>{if(bulbs.has(key(r+dr,c+dc)))cnt++});
      numState[key(r,c)]=cnt===need?'ok':cnt>need?'over':'under';
    }
  }
  // hedef alfa + dalga gecikmesi
  let maxD=0,tot=0,sat=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=cellType[r][c];
    if(!isRoom(t))continue;
    const k=key(r,c);
    const ns=sources[k]?sources[k].size:0;
    let nt;
    if(t==='P')nt=bulbs.has(k)?(ns>=2?1:0.5):(ns>=2?0.6:ns===1?0.26:0);
    else nt=bulbs.has(k)?1:ns>=1?0.6:0;
    if(nt!==target[k]){
      const d=dist[k]??0;
      delayUntil[k]=now+d*(nt>target[k]?55:38);
      maxD=Math.max(maxD,d);
      target[k]=nt;
    }
    tot++;
    const ok=t==='P'?ns>=2:(ns>=1||bulbs.has(k));
    if(ok)sat++;
  }
  if(changed&&maxD>0){
    const steps=Math.min(maxD,6);
    for(let i=0;i<=steps;i++)
      place?pluck(i,i*0.055,0.035):pluck(Math.max(0,steps-i),i*0.038,0.025);
  }else if(changed){
    // yayilmasiz yerlesim (izole fener gibi): tekil nota — cakismada sus (errSfx calar)
    const ck=key(changed[0],changed[1]);
    if(!conflict.has(ck))place?pluck(0,0,0.035):pluck(0,0.02,0.025);
  }
  litRatio=sat/tot;
  progEl.textContent=Math.round(litRatio*100)+'%';
  // kazanma
  if(sat===tot&&conflict.size===0&&Object.values(numState).every(s=>s==='ok')&&!won){
    won=true;winT=now;
    const src=changed||[0,0];
    const D=Array.from({length:rows},()=>new Array(cols).fill(-1));
    const q=[[src[0],src[1]]];D[src[0]][src[1]]=0;
    let compMax=0;
    for(let comp=0;comp<8;comp++){
      while(q.length){
        const[r,c]=q.shift();
        compMax=Math.max(compMax,D[r][c]);
        DIRS.forEach(([dr,dc])=>{
          const nr=r+dr,nc=c+dc;
          if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&D[nr][nc]<0&&cellType[nr][nc]!==' '){
            D[nr][nc]=D[r][c]+1;q.push([nr,nc]);
          }
        });
      }
      // kapsanmamis bina var mi? kivilcim kisa gecikmeyle karsi binaya sicrar
      let jump=null;
      outer:
      for(let r=rows-1;r>=0;r--)for(let c=0;c<cols;c++)
        if(cellType[r][c]!==' '&&D[r][c]<0){jump=[r,c];break outer}
      if(!jump)break;
      D[jump[0]][jump[1]]=compMax+5;
      q.push(jump);
    }
    let wMax=0;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const k=key(r,c);winD[k]=D[r][c];wMax=Math.max(wMax,D[r][c]);
      if(isRoom(cellType[r][c])){target[k]=1;delayUntil[k]=now+D[r][c]*70}
    }
    winMax=wMax;
    if(!dailyMode&&level>best){best=level;localStorage.setItem('cl_best',String(best))}
    if(dailyMode){stopDailyTimer();localStorage.setItem('cl_daily_'+dailyKey(),'1')}
    stopBgMusic(false); // lofi, kaskad boyunca 1.2 sn'de erir
    const partyMs=wMax*70+500;
    setTimeout(discoRiser,Math.max(0,partyMs-650));
    setTimeout(startWinMusic,partyMs);
    for(let i=0;i<=Math.min(wMax,PENT.length-1);i++)pluck(i,i*0.07,0.055);
    setTimeout(()=>{
      hintTxt.className='win show';
      hintTxt.textContent=dailyMode?'Daily Challenge Completed!':(level<LEVELS.length?'Level Completed!':'All Levels Completed!');
      nextBtnEl.hidden=dailyMode||level>=LEVELS.length;
      document.getElementById('menuBtn').hidden=false;
      document.getElementById('boostBtn').hidden=true;
      document.getElementById('resetBtn').hidden=true;
    },wMax*70+600);
    vib([20,40,20,40,60]);
  }
}

let W,H,cell,gx,gy,dpr;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.parentElement.getBoundingClientRect();
  W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=26,padB=48;            // altta yazi seridi: zemin cizgisi + 'Level Completed!' payi
  const extra=hasMask?0.55:0.36;   // sadece ust kapak + zemin payi
  cell=Math.min((W-pad*2)/cols,(H-pad-padB)/(rows+extra));
  roofH=0;groundH=hasMask?cell*0.42:cell*0.12;
  gx=(W-cell*cols)/2;
  gy=H-padB-groundH-cell*rows;     // bina zemine oturur, yazi seridi altta bos kalir
}
window.addEventListener('resize',resize);

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawCat(wx,wy,ws,a,now,jit,dance,col){
  // oturan kedi (dekoratif) — parti modunda dans
  col=col||'#0a0d16';
  ctx.save();
  ctx.globalAlpha=Math.min(1,a*1.2);
  ctx.fillStyle=col;
  const sway=dance?Math.sin(now/170+jit*50)*ws*0.05:0;
  const bob=dance?Math.abs(Math.sin(now/140+jit*30))*ws*0.06:0;
  const tilt=dance?Math.sin(now/210+jit*70)*0.15:0;
  // ara ara camdaki yerini degistirir: kisa kayma + ufak zipla, durus hep ayni
  let ox=0,hop=0;
  if(!dance){
    const seg=6+jit*5;                 // kedi basina 6-11 sn'de bir
    const tt=now/1000+jit*137;
    const si=Math.floor(tt/seg);
    const f=(tt-si*seg)/seg;
    const p0=(bgHash(si*13.7+jit*991)-0.5)*ws*0.24;
    const p1=(bgHash((si+1)*13.7+jit*991)-0.5)*ws*0.24;
    ox=p0;
    if(f>0.9){                          // segmentin son %10'unda gecis
      const q=(f-0.9)/0.1,e=q*q*(3-2*q);
      ox=p0+(p1-p0)*e;
      hop=Math.sin(Math.PI*q)*ws*0.035; // yer degistirirken minik sekme
    }
  }
  const cx=wx+ws*0.5+sway+ox,base=wy+ws*0.97-bob-hop,h=ws*0.46,w=ws*0.34;
  ctx.translate(cx,base);ctx.rotate(tilt);ctx.translate(-cx,-base);
  ctx.beginPath();
  ctx.ellipse(cx,base-h*0.28,w*0.5,h*0.34,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();
  ctx.arc(cx,base-h*0.72,w*0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx-w*0.28,base-h*0.82);ctx.lineTo(cx-w*0.16,base-h*1.05);ctx.lineTo(cx-w*0.04,base-h*0.88);
  ctx.moveTo(cx+w*0.28,base-h*0.82);ctx.lineTo(cx+w*0.16,base-h*1.05);ctx.lineTo(cx+w*0.04,base-h*0.88);
  ctx.fill();
  ctx.strokeStyle=col;
  ctx.lineWidth=ws*0.05;ctx.lineCap='round';
  const wag=dance?Math.sin(now/120+jit*60)*w*0.3:0;
  ctx.beginPath();
  ctx.moveTo(cx+w*0.45,base-h*0.15);
  ctx.quadraticCurveTo(cx+w*0.95+wag,base-h*0.3,cx+w*0.8+wag*0.6,base-h*0.7);
  ctx.stroke();
  ctx.restore();
}
function drawSleepingHuman(wx,wy,ws,a,now,jit){
  // yatakta uyuyan komsu — karanlikta da soluk gorunur (mekanik hucre)
  ctx.save();
  const dark=a<0.25;
  const col=dark?'rgba(96,112,148,0.5)':'#0a0d16';
  const breath=Math.sin(now/700+jit*20);
  const bx=wx+ws*0.1,bw=ws*0.8,by=wy+ws*0.68,bh=ws*0.15;
  if(dark){ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.2,ws*0.035)}
  else ctx.fillStyle=col;
  // yatak
  dark?ctx.strokeRect(bx,by,bw,bh):ctx.fillRect(bx,by,bw,bh);
  // yatak ayaklari
  if(!dark){
    ctx.fillRect(bx,by+bh,ws*0.05,ws*0.08);
    ctx.fillRect(bx+bw-ws*0.05,by+bh,ws*0.05,ws*0.08);
  }
  // yastikta bas
  const hx=bx+ws*0.13,hy=by-ws*0.05;
  ctx.beginPath();ctx.arc(hx,hy,ws*0.075,0,Math.PI*2);
  dark?ctx.stroke():ctx.fill();
  // battaniye tumsegi (nefesle inip kalkar)
  ctx.beginPath();
  ctx.moveTo(bx+ws*0.22,by);
  ctx.quadraticCurveTo(bx+bw*0.55,by-ws*(0.11+0.015*breath),bx+bw*0.96,by);
  ctx.closePath();
  dark?ctx.stroke():ctx.fill();
  // zzz — bastan yukari sag capraza suzulen baloncuklar
  if(!dark){
    ctx.save();
    ctx.textAlign='center';
    for(let i=0;i<3;i++){
      const pz=((now/3200)+i*0.34+jit*7)%1;
      const az=Math.sin(Math.PI*pz);
      if(az<0.05)continue;
      const sz=ws*(0.10+pz*0.11);
      ctx.globalAlpha=az*0.8;
      ctx.fillStyle='rgba(20,26,42,0.95)';
      ctx.font=`600 ${sz}px -apple-system,sans-serif`;
      ctx.fillText('z',
        hx+ws*0.10+pz*ws*0.22+Math.sin(pz*9+jit*10)*ws*0.02,
        hy-ws*0.05-pz*ws*0.34);
    }
    ctx.restore();
  }
  ctx.restore();
}
function drawDancingHuman(wx,wy,ws,now,jit){
  // uyanmis komsu minik dans eder
  ctx.save();
  ctx.fillStyle='#0a0d16';ctx.strokeStyle='#0a0d16';
  const sway=Math.sin(now/160+jit*50)*ws*0.045;
  const bob=Math.abs(Math.sin(now/140+jit*30))*ws*0.045;
  const cx=wx+ws*0.5+sway,base=wy+ws*0.95-bob;
  const H=ws*0.52;
  ctx.beginPath();ctx.arc(cx,base-H*0.85,H*0.15,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=ws*0.055;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,base-H*0.68);ctx.lineTo(cx,base-H*0.3);ctx.stroke();
  const wave=Math.sin(now/130+jit*40);
  ctx.beginPath();
  ctx.moveTo(cx,base-H*0.6);
  ctx.lineTo(cx-H*0.28,base-H*(0.88+0.12*wave));
  ctx.moveTo(cx,base-H*0.6);
  ctx.lineTo(cx+H*0.28,base-H*(0.88-0.12*wave));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx,base-H*0.3);ctx.lineTo(cx-H*0.15,base);
  ctx.moveTo(cx,base-H*0.3);ctx.lineTo(cx+H*0.15,base);
  ctx.stroke();
  ctx.restore();
}
function drawWindowCell(x,y,s,st,jit,now,k){
  const m=s*0.13;
  let wx=x+m,wy=y+m;const ws=s-m*2;
  // kedi reddi sarsintisi
  if(denyAt[k]){
    const el=now-denyAt[k];
    if(el<300)wx+=Math.sin(el/22)*(1-el/300)*s*0.05;
    else delete denyAt[k];
  }
  ctx.fillStyle='#05070e';
  ctx.fillRect(wx-1,wy-1,ws+2,ws+2);
  let a=alpha[k];
  let flare=0;
  if(won&&winD[k]>=0){
    const p=now-winT-winD[k]*70;
    if(p>0&&p<340)flare=Math.sin(p/340*Math.PI)*0.5;
  }
  let hue=st.bulb?45:33;
  if(st.bulb&&placedAt[k]){
    const age=now-placedAt[k];
    if(age<260)hue=14+(45-14)*(age/260);
  }
  if(a>0.02){
    const flick=0.94+0.06*Math.sin(now/900+jit*40);
    const aa=Math.min(1,a*flick+flare);
    const g=ctx.createRadialGradient(wx+ws/2,wy+ws/2,ws*0.1,wx+ws/2,wy+ws/2,ws*0.75);
    g.addColorStop(0,`hsla(${hue+6},${st.bulb?60:86}%,${(st.bulb?84:72)+flare*14}%,${aa})`);
    g.addColorStop(1,`hsla(${hue},${st.bulb?56:80}%,${(st.bulb?64:50)+flare*12}%,${aa*0.9})`);
    ctx.fillStyle=g;ctx.fillRect(wx,wy,ws,ws);
    if(st.bulb||flare>0.1){
      ctx.save();
      ctx.shadowColor=st.conf?'rgba(255,95,77,0.7)':`hsla(${hue},90%,60%,${0.6+flare*0.4})`;
      ctx.shadowBlur=s*(0.35+flare*0.3);
      ctx.fillStyle=st.conf?'rgba(255,95,77,0.25)':`hsla(${hue},85%,58%,${0.25+flare*0.2})`;
      ctx.fillRect(wx,wy,ws,ws);
      ctx.restore();
    }
  }else{
    ctx.fillStyle='#0b0f1b';ctx.fillRect(wx,wy,ws,ws);
    ctx.fillStyle='rgba(48,60,92,0.16)';ctx.fillRect(wx,wy,ws,ws*0.32);
  }
  // perde dokusu (P): ust ve yanlarda kalin drape
  if(st.curtain){
    ctx.fillStyle=a>0.3?'rgba(64,32,20,0.75)':'rgba(28,24,38,0.9)';
    ctx.fillRect(wx,wy,ws,ws*0.2);
    const nWaves=4;
    for(let i=0;i<nWaves;i++){
      const px=wx+ws*(0.06+i*0.9/nWaves);
      ctx.fillRect(px,wy,ws*0.07,ws*(0.32+((i%2)?0.1:0)));
    }
    ctx.fillRect(wx,wy,ws*0.12,ws);
    ctx.fillRect(wx+ws*0.88,wy,ws*0.12,ws);
    // kaynak noktalari: 2 gerekli
    const ns=st.nsrc;
    for(let i=0;i<2;i++){
      ctx.beginPath();
      ctx.arc(wx+ws*0.5+(i?ws*0.11:-ws*0.11),wy+ws*0.9,ws*0.05,0,Math.PI*2);
      ctx.fillStyle=i<ns?'#ffb84d':'rgba(122,130,152,0.45)';
      ctx.fill();
    }
  }
  if(st.sleeper&&!st.party)drawSleepingHuman(wx,wy,ws,a,now,jit);
  if(st.sleeper&&st.party)drawDancingHuman(wx,wy,ws,now,jit);
  if(st.decorCat&&!st.bulb)drawCat(wx,wy,ws,Math.max(a,st.party?0.6:0),now,jit,st.party);
  // kayit citalari: sehir mimarisine gore
  ctx.strokeStyle=a>0.3?'rgba(30,22,10,0.85)':'rgba(20,26,42,0.9)';
  ctx.lineWidth=Math.max(1.5,s*0.045);
  ctx.beginPath();
  const wst=cityOf(level).win;
  if(wst==='sash'){
    ctx.moveTo(wx,wy+ws*0.34);ctx.lineTo(wx+ws,wy+ws*0.34);
    ctx.moveTo(wx,wy+ws*0.67);ctx.lineTo(wx+ws,wy+ws*0.67);
  }else if(wst==='shutter'){
    for(let i=1;i<5;i++){ctx.moveTo(wx,wy+ws*i/5);ctx.lineTo(wx+ws,wy+ws*i/5)}
  }else if(wst==='bay'){
    ctx.moveTo(wx+ws*0.26,wy);ctx.lineTo(wx+ws*0.26,wy+ws);
    ctx.moveTo(wx+ws*0.74,wy);ctx.lineTo(wx+ws*0.74,wy+ws);
  }else if(wst==='shoji'){
    ctx.moveTo(wx+ws*0.33,wy);ctx.lineTo(wx+ws*0.33,wy+ws);
    ctx.moveTo(wx+ws*0.66,wy);ctx.lineTo(wx+ws*0.66,wy+ws);
    ctx.moveTo(wx,wy+ws*0.33);ctx.lineTo(wx+ws,wy+ws*0.33);
    ctx.moveTo(wx,wy+ws*0.66);ctx.lineTo(wx+ws,wy+ws*0.66);
  }else if(wst==='balcony'){
    ctx.moveTo(wx+ws/2,wy);ctx.lineTo(wx+ws/2,wy+ws);
    ctx.moveTo(wx,wy+ws*0.44);ctx.lineTo(wx+ws,wy+ws*0.44);
  }else if(wst==='roman'){
    ctx.moveTo(wx+ws/2,wy);ctx.lineTo(wx+ws/2,wy+ws);
    for(let i=3;i<5;i++){ctx.moveTo(wx,wy+ws*i/5);ctx.lineTo(wx+ws,wy+ws*i/5)}
  }else if(wst==='transom'){
    ctx.moveTo(wx,wy+ws*0.3);ctx.lineTo(wx+ws,wy+ws*0.3);
    ctx.moveTo(wx+ws/2,wy+ws*0.3);ctx.lineTo(wx+ws/2,wy+ws);
  }else if(wst==='arch'||wst==='ottoman'){
    ctx.moveTo(wx+ws/2,wy);ctx.lineTo(wx+ws/2,wy+ws);
    ctx.moveTo(wx,wy+ws*0.42);ctx.lineTo(wx+ws,wy+ws*0.42);
  }else{
    ctx.moveTo(wx+ws/2,wy);ctx.lineTo(wx+ws/2,wy+ws);
    ctx.moveTo(wx,wy+ws/2);ctx.lineTo(wx+ws,wy+ws/2);
  }
  ctx.stroke();
  if(wst==='roman'){
    ctx.beginPath();
    ctx.ellipse(wx+ws/2,wy+ws*0.34,ws*0.5,ws*0.34,0,Math.PI,Math.PI*2);
    ctx.stroke();
  }
  if(wst==='balcony'){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle=cityOf(level).accent;
    ctx.lineWidth=Math.max(1,s*0.028);
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const xx=wx+2+i*(ws-4)/4;
      ctx.moveTo(xx,wy+ws+s*0.02);ctx.lineTo(xx,wy+ws+s*0.09);
    }
    ctx.moveTo(wx-2,wy+ws+s*0.09);ctx.lineTo(wx+ws+2,wy+ws+s*0.09);
    ctx.stroke();
    ctx.restore();
  }
  if(wst==='arch'||wst==='ottoman'){
    // tam kemer: iki yandan cerceveye oturur, tepesi ust kenara degier
    ctx.beginPath();
    ctx.ellipse(wx+ws/2,wy+ws*0.42,ws*0.5,ws*0.42,0,Math.PI,Math.PI*2);
    ctx.stroke();
    if(wst==='ottoman'){
      ctx.save();
      ctx.globalAlpha=0.55;
      ctx.strokeStyle=cityOf(level).accent;
      ctx.lineWidth=Math.max(1,s*0.03);
      ctx.beginPath();
      ctx.moveTo(wx,wy+ws+s*0.06);ctx.lineTo(wx+ws,wy+ws+s*0.06);
      ctx.stroke();
      ctx.restore();
    }
  }
  if(st.bulb){
    const cx=wx+ws/2,cy=wy+ws/2,r=ws*0.16;
    const pulse=st.conf?(0.8+0.2*Math.sin(now/120)):1;
    let pop=1;
    if(placedAt[k]){const age=now-placedAt[k];if(age<220)pop=1+0.35*Math.sin(age/220*Math.PI)}
    ctx.fillStyle=st.conf?`rgba(255,95,77,${pulse})`:'rgba(255,244,214,0.95)';
    ctx.beginPath();ctx.arc(cx,cy-r*0.2,r*pop,0,Math.PI*2);ctx.fill();
    ctx.fillRect(cx-r*0.45*pop,cy+r*0.55,r*0.9*pop,r*0.55);
    ctx.strokeStyle='rgba(60,40,10,0.5)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx,wy);ctx.stroke();
  }
  if(st.mark&&!st.bulb){
    ctx.strokeStyle='rgba(120,130,155,0.55)';
    ctx.lineWidth=Math.max(1.5,s*0.04);
    const p=ws*0.3;
    ctx.beginPath();
    ctx.moveTo(wx+p,wy+p);ctx.lineTo(wx+ws-p,wy+ws-p);
    ctx.moveTo(wx+ws-p,wy+p);ctx.lineTo(wx+p,wy+ws-p);
    ctx.stroke();
  }
  ctx.strokeStyle=st.conf?'rgba(255,95,77,0.8)':a>0.3?'rgba(70,50,22,0.9)':'#1b2233';
  ctx.lineWidth=Math.max(1.5,s*0.05);
  ctx.strokeRect(wx,wy,ws,ws);
}
function drawMirror(x,y,s,t,k,now,active){

}
function drawBlock(x,y,s,t,k,now){

  ctx.lineWidth=2;
  ctx.strokeRect(x+m,y+m,s-m*2,s-m*2);
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=1;
  for(let i=1;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x+m*2,y+m+((s-m*2)/4)*i);
    ctx.lineTo(x+s-m*2,y+m+((s-m*2)/4)*i);
    ctx.stroke();
  }
  const isFail=failMates.has(k);
  if(isFail){
    ctx.strokeStyle=`rgba(255,95,77,${0.55+0.45*Math.sin(now/110)})`;
    ctx.lineWidth=2.5;
    ctx.strokeRect(x+m,y+m,s-m*2,s-m*2);
  }
  if(t>='0'&&t<='4'){
    const st=numState[k];
    ctx.fillStyle=isFail?'#ff5f4d':st==='ok'?'#ffb84d':st==='over'?'#ff5f4d':'#7a8298';
    ctx.font=`600 ${s*0.42}px -apple-system,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(st==='ok'){
      ctx.save();
      ctx.shadowColor='rgba(255,184,77,0.6)';ctx.shadowBlur=8;
      ctx.fillText(t,x+s/2,y+s/2+1);
      ctx.restore();
    }else ctx.fillText(t,x+s/2,y+s/2+1);
  }
}

function boothDeco(b){
  // K2 telefon kulubesi: kubbe + isikli tabela bandi
  const mp2=cell*0.16;
  const x0=gx+b.c0*cell-mp2,x1=gx+(b.c1+1)*cell+mp2;
  const ty=gy+b.top*cell-mp2;
  const cxm=(x0+x1)/2;
  ctx.fillStyle='#3a1216';
  ctx.beginPath();
  ctx.moveTo(x0,ty+1);
  ctx.quadraticCurveTo(cxm,ty-cell*0.5,x1,ty+1);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,220,150,0.8)';
  ctx.fillRect(x0+cell*0.14,ty-cell*0.08,(x1-x0)-cell*0.28,cell*0.12);
}
function lampPostDeco(b){
  const c=b.c0,x=gx+c*cell+cell*0.5;
  const ty=gy+b.top*cell,baseY=gy+rows*cell;
  // fener sapkasi + topuz
  ctx.fillStyle='#171c2b';
  ctx.beginPath();
  ctx.moveTo(x-cell*0.36,ty+1);ctx.lineTo(x+cell*0.36,ty+1);ctx.lineTo(x,ty-cell*0.24);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(x,ty-cell*0.27,cell*0.05,0,Math.PI*2);ctx.fill();
  // fener yandiginda kaldirimda isik golu
  const aH=alpha[key(b.top,c)]||0;
  if(aH>0.03){
    const gpool=ctx.createRadialGradient(x,baseY,0,x,baseY,cell*0.95);
    gpool.addColorStop(0,`rgba(255,190,110,${0.11*aH})`);
    gpool.addColorStop(1,'rgba(255,190,110,0)');
    ctx.fillStyle=gpool;
    ctx.beginPath();ctx.ellipse(x,baseY,cell*0.95,cell*0.22,0,0,Math.PI*2);ctx.fill();
  }
}

const _iconCache={};
// Sehir havuzlari ICONB'den turetilir: o sehrin levellerinde kullanilan tum ikonlar
const CITY_ICON_POOL=(()=>{
  const P=CITIES.map(()=>new Set());
  for(const[l,m]of Object.entries(ICONB)){
    const ci=Math.min(CITIES.length-1,((+l-1)/50)|0);
    for(const v of Object.values(m))P[ci].add(v);
  }
  return P.map(st=>[...st].sort());
})();
// ICONB'de kaydi olmayan X'lere sehir havuzundan deterministik ikon (level+sira bazli, herkes ayni gorur)
let _fbLvl=-1,_fbMap={};
function fallbackIcons(){
  if(_fbLvl===level&&!dailyMode)return _fbMap;
  _fbLvl=level;_fbMap={};
  if(dailyMode)return _fbMap;
  const ci=Math.min(CITIES.length-1,((level-1)/50)|0);
  const pool=CITY_ICON_POOL[ci];
  if(!pool.length)return _fbMap;
  let h=(level*2654435761)>>>0,n=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(cellType[r][c]!=='X')continue;
    if(hasMask&&LPCOLS.includes(c))continue;
    const k=key(r,c);
    if(ICONB[level]&&ICONB[level][k])continue;
    _fbMap[k]=pool[(h+n)%pool.length];n++;
  }
  return _fbMap;
}
function getIconImg(t){
  if(!ICON_IMG[t])return null;
  if(!_iconCache[t]){const im=new Image();im.src=ICON_IMG[t];_iconCache[t]=im}
  return _iconCache[t];
}
function drawIconBlock(x,y,type){
  const p=cell*0.07;
  ctx.fillStyle='#141a2b';
  roundRect(x+p,y+p,cell-2*p,cell-2*p,6);
  ctx.fill();
  const im=getIconImg(type);
  if(im&&im.complete&&im.naturalWidth){
    ctx.save();
    roundRect(x+p,y+p,cell-2*p,cell-2*p,6);
    ctx.clip();
    ctx.drawImage(im,x+p,y+p,cell-2*p,cell-2*p);
    ctx.restore();
  }
}

function cartDeco(b,c1,c2){

function drawStreetLamp(x,baseY,h,side,now,inten){

      if(!filled(r+1,c)){
        const xa=filled(r+1,c-1)?x0+mp:x0-mp, xb=filled(r+1,c+1)?x1-mp:x1+mp;
        ctx.moveTo(xa,y1+mp);ctx.lineTo(xb,y1+mp);
      }
      if(!filled(r,c-1)){
        const ya=filled(r-1,c-1)?y0+mp:y0-mp, yb=filled(r+1,c-1)?y1-mp:y1+mp;
        ctx.moveTo(x0-mp,ya);ctx.lineTo(x0-mp,yb);
      }
      if(!filled(r,c+1)){
        const ya=filled(r-1,c+1)?y0+mp:y0-mp, yb=filled(r+1,c+1)?y1-mp:y1+mp;
        ctx.moveTo(x1+mp,ya);ctx.lineTo(x1+mp,yb);
      }
    }
    ctx.stroke();
    ctx.restore();
  }else{
  const bx=gx-fp,bw=cell*cols+fp*2;
  const by=gy-cell*0.18,bh=cell*rows+cell*0.18+groundH; // sadece ince ust kapak
  const CTY=cityOf(level);
  const fc=CTY.facade;
  const bodyCol=`rgb(${fc[0]+warm*10},${fc[1]+warm*7},${fc[2]+warm*4})`;
  // govde
  ctx.fillStyle=bodyCol;
  roundRect(bx,by,bw,bh,8);
  ctx.fill();
  // sehir aksan konturu (cok ince)
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.strokeStyle=CTY.accent;
  ctx.lineWidth=1.5;
  roundRect(bx,by,bw,bh,8);
  ctx.stroke();
  ctx.restore();
  // kat cizgileri
  ctx.strokeStyle='rgba(255,255,255,0.025)';
  ctx.lineWidth=1;
  for(let r=1;r<rows;r++){
    ctx.beginPath();
    ctx.moveTo(bx,gy+r*cell);ctx.lineTo(bx+bw,gy+r*cell);
    ctx.stroke();
  }
  const pbB=by+bh;
  // zemin cizgisi: ince ve sabit; kazaninca renk degisimiyle aydinlanir (hareket yok)
  let gA=0.06,gCol='255,255,255';
  if(won){
    const gl=Math.min(1,(now-winT)/700);
    gA=0.06+0.7*gl;gCol='255,192,112';
  }
  ctx.strokeStyle=`rgba(${gCol},${gA})`;
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,pbB+1);ctx.lineTo(W,pbB+1);ctx.stroke();
  }
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=cellType[r][c],k=key(r,c);
    if(t===' ')continue;
    const x=gx+c*cell,y=gy+r*cell;
    if(hasMask&&LPCOLS.includes(c)&&t==='X'){
      // sokak lambasi diregi
      ctx.fillStyle='#171c2b';
      ctx.fillRect(x+cell*0.44,y-cell*0.06,cell*0.12,cell*1.12);
      continue;
    }
    if(!dailyMode&&ICONB[level]&&ICONB[level][k]){
      drawIconBlock(x,y,ICONB[level][k]);
      continue;
    }
    if(t==='X'){
      const fb=fallbackIcons()[k];
      if(fb){drawIconBlock(x,y,fb);continue;}
    }
    if(isRoom(t)){
      drawWindowCell(x,y,cell,{
        bulb:bulbs.has(k),
        mark:marks.has(k),
        conf:won?false:(conflict.has(k)||k===failBulb||failMates.has(k)),
        decorCat:t==='.'&&hueJit[idx(r,c)]>0.93,
        sleeper:t==='C',
        curtain:t==='P',
        nsrc:sources[k]?Math.min(2,sources[k].size):0,
        party:party
      },hueJit[idx(r,c)],now,k);
    }else if(t==='/'||t==='\\'){
      drawMirror(x,y,cell,t,k,now,activeMirrors.has(k)||won);
    }else{
      drawBlock(x,y,cell,t,k,now);
    }
  }
  if(hasMask)drawMonumentDeco(now,party);
  // kirik kalp efekti (yanlis yerlestirme noktasinda)
  brokenHearts=brokenHearts.filter(b=>now-b.t<1400);
  brokenHearts.forEach(b=>{
    const[r,c]=b.k.split(',').map(Number);
    const el=(now-b.t)/1400;
    const pop=el<0.12?1+Math.sin(el/0.12*Math.PI)*0.25:1; // giriste kucuk zipla
    ctx.save();
    ctx.globalAlpha=el<0.55?1:1-(el-0.55)/0.45;
    // kirmizi hale
    const hx=gx+(c+0.5)*cell, hy=gy+(r+0.5)*cell-el*cell*0.7;
    const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,cell*0.55);
    hg.addColorStop(0,'rgba(255,80,70,0.28)');
    hg.addColorStop(1,'rgba(255,80,70,0)');
    ctx.fillStyle=hg;
    ctx.fillRect(hx-cell*0.6,hy-cell*0.6,cell*1.2,cell*1.2);
    ctx.font=`${cell*0.68*pop*(1+el*0.15)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('💔',hx,hy);
    ctx.restore();
  });
  ctx.restore();
  requestAnimationFrame(draw);
}

let pressTimer=null,pressCell=null,longFired=false;
function cellAt(e){
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const c=Math.floor((x-gx)/cell),rr=Math.floor((y-gy)/cell);
  if(c<0||c>=cols||rr<0||rr>=rows)return null;
  return[rr,c];
}
cv.addEventListener('pointerdown',e=>{
  if(won||penalizing||modalOpen)return;
  const p=cellAt(e);if(!p)return;
  const[r,c]=p,t=cellType[r][c];
  if(t!=='.'&&t!=='P')return; // C dahil digerlerine islem yok (C reddi pointerup'ta)
  pressCell=p;longFired=false;
  pressTimer=setTimeout(()=>{
    longFired=true;
    const k=key(r,c);
    if(bulbs.has(k))return;
    if(marks.has(k))marks.delete(k);else marks.add(k);
    vib(20);tone(260,0.05,0.03);
  },350);
});
cv.addEventListener('pointerup',e=>{
  clearTimeout(pressTimer);
  if(won||penalizing||modalOpen)return;
  document.querySelectorAll('.rule.teach').forEach(el=>el.classList.remove('teach'));
  if(level<=3){clearTimeout(tipTimer);tipEl.classList.remove('show')}
  const p=cellAt(e);
  if(p){
    const[r,c]=p,t=cellType[r][c],k=key(r,c);
    if(t==='C'){ // komsuyu uyandirma!
      denyAt[k]=performance.now();
      vib([15,30,15]);tone(180,0.12,0.045);
      showTooltip(TXT_SLEEPER,r,c);
      pressCell=null;return;
    }
    if(t==='/'||t==='\\'){
      showTooltip(TXT_MIRROR,r,c);
      pressCell=null;return;
    }
  }
  if(longFired||!pressCell)return;
  if(!p||p[0]!==pressCell[0]||p[1]!==pressCell[1]){pressCell=null;return}
  const[r,c]=p,k=key(r,c);
  if(bulbs.has(k)){
    bulbs.delete(k);
    delete placedAt[k];
    vib(10);
    recompute(p,false);
  }else{
    if(marks.has(k))marks.delete(k);
    bulbs.add(k);
    placedAt[k]=performance.now();
    const inv=checkInvalid(k,r,c);
    if(inv){
      penalize(k,inv);
    }else{
      vib(14);
      recompute(p,true);
    }
  }
  pressCell=null;
});
cv.addEventListener('pointercancel',()=>{clearTimeout(pressTimer);pressCell=null});

document.getElementById('boostBtn').addEventListener('click',()=>{
  if(won||penalizing||modalOpen||hintsLeft<=0)return;
  const solArr=dailyMode?DAILY_SOLUTIONS[dailyIdx]:SOLUTIONS[level-1];
  const sol=new Set(solArr.map(([r,c])=>r+','+c));
  const wrong=[...bulbs].filter(k=>!sol.has(k));
  if(wrong.length){
    const k=wrong[0];
    const[r,c]=k.split(',').map(Number);
    bulbs.delete(k);delete placedAt[k];
    recompute([r,c],false);
  }else{
    const missing=[...sol].filter(k=>!bulbs.has(k));
    if(!missing.length)return;
    const k=missing[(Math.random()*missing.length)|0];
    const[r,c]=k.split(',').map(Number);
    if(marks.has(k))marks.delete(k);
    bulbs.add(k);placedAt[k]=performance.now();
    recompute([r,c],true);
  }
  hintsLeft--;updateHintBadge();
  vib(14);tone(700,0.1,0.05);
});

const menuEl=document.getElementById('menu');
const skyCv=document.getElementById('menuSky'),skyCtx=skyCv.getContext('2d');
let skyStars=[],skyRunning=false;
function skyInit(){
  const r=menuEl.getBoundingClientRect();
  const d=Math.min(2,window.devicePixelRatio||1);
  skyCv.width=r.width*d;skyCv.height=r.height*d;
  skyCtx.setTransform(d,0,0,d,0,0);
  skyCv._w=r.width;skyCv._h=r.height;
  if(!skyStars.length)
    for(let i=0;i<54;i++)skyStars.push(newStar(true));
}
function newStar(mid){
  return{x:Math.random(),y:Math.random(),r:0.6+Math.random()*1.3,
    t0:performance.now()-(mid?Math.random()*6000:0),
    dur:4500+Math.random()*4500};
}
function skyLoop(now){
  if(menuEl.hidden){skyRunning=false;return}
  // logo kedisi: yavas yasayan dongu
  const cSit=document.getElementById('logoCatSit');
  const cWalk=document.getElementById('logoCatWalk');
  if(cSit&&cWalk){
    const ct=(now/1000)%14;
    let sitV=false,walkV=false,wx=0,dir=1;
    if(ct<6.5)sitV=true;
    else if(ct<8.5){walkV=true;dir=1;wx=-((ct-6.5)/2)*30}
    else if(ct<11.5){}
    else if(ct<13.5){walkV=true;dir=-1;wx=-30+((ct-11.5)/2)*30}
    else sitV=true;
    cSit.setAttribute('opacity',sitV?'1':'0');
    cWalk.setAttribute('opacity',walkV?'1':'0');
    if(walkV){
      const bob=Math.sin(now/85)*0.6;
      cWalk.setAttribute('transform',
        `translate(${150+wx*1.15},${36.4+bob}) scale(${dir*1.3},1.3)`);
    }
  }
  const w=skyCv._w,h=skyCv._h;
  skyCtx.clearRect(0,0,w,h);
  const g=skyCtx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#04060d');g.addColorStop(1,'#0b0f1c');
  skyCtx.fillStyle=g;skyCtx.fillRect(0,0,w,h);
  // hilal: cok yavas suruklenme
  const mx=w*0.82+Math.sin(now/11000)*w*0.035;
  const my=h*0.1+Math.cos(now/15000)*h*0.02;
  const mr=Math.min(w,h)*0.035;
  const halo=skyCtx.createRadialGradient(mx,my,mr*0.5,mx,my,mr*3.2);
  halo.addColorStop(0,'rgba(240,234,206,0.10)');
  halo.addColorStop(1,'rgba(240,234,206,0)');
  skyCtx.fillStyle=halo;
  skyCtx.fillRect(mx-mr*3.4,my-mr*3.4,mr*6.8,mr*6.8);
  skyCtx.fillStyle='rgba(240,234,206,0.9)';
  skyCtx.beginPath();skyCtx.arc(mx,my,mr,0,Math.PI*2);skyCtx.fill();
  skyCtx.fillStyle=g;
  skyCtx.beginPath();skyCtx.arc(mx-mr*0.42,my-mr*0.2,mr*0.85,0,Math.PI*2);skyCtx.fill();
  // yildizlar: yumusak belirip kaybolur, kaybolunca yeni yerde dogar
  skyStars.forEach((st,i)=>{
    let pr=(now-st.t0)/st.dur;
    if(pr>=1){skyStars[i]=newStar(false);return}
    const a=Math.sin(Math.PI*pr);         // 0 -> 1 -> 0
    skyCtx.fillStyle=`rgba(208,218,255,${0.72*a})`;
    skyCtx.beginPath();
    skyCtx.arc(st.x*w,st.y*h,st.r*(0.8+0.2*a),0,Math.PI*2);
    skyCtx.fill();
  });
  requestAnimationFrame(skyLoop);

const cityDone=i=>Math.max(0,Math.min(best-i*50,50));
const curCityIdx=()=>{
  const pl=Math.max(1,Math.min(level,LEVELS.length));
  return Math.min(CITIES.length-1,((pl-1)/50)|0);
};
function refreshMenu(){
  const ci=curCityIdx(),C=CITIES[ci];
  // vitrin ilerlemesi: mevcut levelin sehir icindeki konumu (best degil)
  const _vpl=Math.max(1,Math.min(level,LEVELS.length));
  const prog=Math.min(50,Math.max(0,_vpl-1-ci*50));
  document.getElementById('curArt').innerHTML=`<image href="${CITY_HEROIMG[ci]}" x="0" y="0" width="180" height="80" preserveAspectRatio="xMidYMid slice"/>`;
  const nm=document.getElementById('curName');
  nm.textContent=C.name;nm.style.color=C.accent;
  document.getElementById('curCard').style.borderColor=C.accent;
  document.getElementById('curBar').style.width=(prog/50*100)+'%';
  document.getElementById('curCnt').textContent=prog+' / 50';
  document.getElementById('curDot').style.left=(prog/50*100)+'%';
  const nl=document.getElementById('nextLine');
  if(ci+1<CITIES.length){
    nl.style.visibility='visible';
    document.getElementById('nextChip').src=CITY_CHIP[ci+1];
    const left=50-prog;
    document.getElementById('nextTxt').textContent='Next: '+titleCase(CITIES[ci+1].name)+(left>0?' \u00b7 '+left+' level'+(left===1?'':'s'):'');
  }else nl.style.visibility='hidden';
  const _pl=Math.max(1,Math.min(level,LEVELS.length));
  const _hard=isHardLevel(_pl);
  document.getElementById('playLvl').textContent='Level '+_pl;
  document.getElementById('playSub').hidden=!_hard;
  document.getElementById('playBtn').classList.toggle('hard',_hard);
  const done=CITIES.filter((_,i)=>cityDone(i)>=50).length;
  document.getElementById('citiesCnt').textContent=done+'/'+CITIES.length;
  document.getElementById('passCnt').textContent=done+'/'+CITIES.length+' stamped';
}
function isHardLevel(n){return n%50===0}
function titleCase(t){return t.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' ')}
function buildPassport(){
  const g=document.getElementById('stampGrid');
  g.innerHTML=CITIES.map((C,i)=>{
    const d=cityDone(i),unlocked=best>=i*50;
    const st=d>=50?'done':(unlocked?'active':'locked');
    const acc=st==='locked'?'#3a4258':C.accent;
    const R=42,CIRC=2*Math.PI*R;
    let extra='';
    if(st==='done')extra=`<circle cx="60" cy="52" r="35" fill="none" stroke="${acc}" stroke-width="1"/>`;
    if(st==='active')extra=`<circle cx="60" cy="52" r="${R}" fill="none" stroke="var(--amber)" stroke-width="3"
      stroke-dasharray="${(d/50*CIRC).toFixed(1)} ${CIRC.toFixed(1)}" transform="rotate(-90 60 52)" stroke-linecap="round"/>`;
    const sub=st==='locked'
      ?'<text x="60" y="134" text-anchor="middle" font-size="10" fill="#5a6278">🔒</text>'
      :`<text x="60" y="133" text-anchor="middle" font-size="9" letter-spacing="1" fill="${st==='done'?acc:'var(--amber)'}">${d}/50</text>`;
    const fs=C.name.length>9?7.4:9.5;
    return `<div class="stamp" data-i="${i}"><svg viewBox="0 0 120 145">
      <circle cx="60" cy="52" r="${R}" fill="none" stroke="${acc}" stroke-width="${st==='done'?2.6:1.6}" opacity="${st==='locked'?0.7:1}"/>
      ${extra}
      <defs><clipPath id="pclip${i}"><circle cx="60" cy="52" r="40"/></clipPath></defs>
      <image href="${CITY_CHIP[i]}" x="20" y="12" width="80" height="80" clip-path="url(#pclip${i})" opacity="${st==='locked'?0.3:1}"/>
      <text x="60" y="115" text-anchor="middle" font-size="${fs}" font-weight="700" letter-spacing="1.3"
        fill="${st==='locked'?'#5a6278':'#cfc9ba'}">${C.name}</text>
      ${sub}
    </svg></div>`;
  }).join('');
  g.querySelectorAll('.stamp').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=+el.dataset.i;
      if(best<i*50){vib(20);return}
      document.getElementById('passport').hidden=true;
      startAt(Math.max(i*50+1,Math.min(best+1,i*50+50)));vib(10);
    });
  });
}
document.getElementById('citiesBtn').addEventListener('click',()=>{
  buildPassport();document.getElementById('passport').hidden=false;vib(8);
});
document.getElementById('passBack').addEventListener('click',()=>{
  document.getElementById('passport').hidden=true;vib(8);
});
document.getElementById('dailyBtn').addEventListener('click',()=>{startDaily();vib(12)});
document.getElementById('curCard').addEventListener('click',()=>{
  startAt(Math.max(1,Math.min(level,LEVELS.length)));vib(10);
});
function openMenu(){
  exitDaily();
  stopWinMusic();
  const _dd=document.getElementById('dailyDot');
  if(_dd)_dd.style.opacity=localStorage.getItem('cl_daily_'+dailyKey())?'0':'1';
  setTimeout(ensureBg,120);
  refreshMenu();menuEl.hidden=false;
  skyInit();
  if(!skyRunning){skyRunning=true;requestAnimationFrame(skyLoop)}
}
window.addEventListener('resize',()=>{if(!menuEl.hidden)skyInit()});
function startAt(n){
  exitDaily();
  menuEl.hidden=true;
  level=Math.max(1,Math.min(LEVELS.length,n));
  localStorage.setItem('aydinlat_lvl',String(level));
  loadLevel();resize();
}
document.getElementById('playBtn').addEventListener('click',()=>{
  startAt(Math.max(1,Math.min(level,LEVELS.length)));vib(10);
});
document.getElementById('homeBtn').addEventListener('click',()=>{openMenu();vib(8)});
document.getElementById('menuBtn').addEventListener('click',()=>{openMenu();vib(8)});

loadLevel();
resize();
openMenu();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
